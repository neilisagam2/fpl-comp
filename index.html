<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Companion — Build Me a Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">SQUAD<span>SIGNAL</span></div>
      <div class="brand-sub">FPL Companion</div>
    </div>
    <div class="meta-pill" id="meta-pill">Loading data…</div>
  </header>

  <div class="app-body">
    <aside class="controls-panel" id="controls-panel">
      <div class="empty-state">Loading controls…</div>
    </aside>

    <main class="pitch-panel">
      <div class="pitch" id="pitch">
        <div class="empty-state">
          Set your formation and risk tolerance, then hit<br>
          <strong>Build me a team</strong> to generate a squad.
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
